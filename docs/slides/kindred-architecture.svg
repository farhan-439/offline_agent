<text x="88" y="88" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="12" letter-spacing="2.6" fill="#2F6B57">KINDRED · LOCAL MEMORY ARCHITECTURE</text>
<text x="88" y="148" font-family="Georgia, Charter, serif" font-size="47" fill="#16221E">A private memory that shows its receipts</text>
<text x="88" y="181" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="15.5" fill="#5B655F">Speech in, grounded memory out. Every answer cites the sentence and the recording it came from.</text>
<g>
  <rect x="1492" y="66" width="164" height="30" rx="15" fill="#E4EDE7" stroke="none"/>
  <circle cx="1514" cy="81" r="3.6" fill="#2F6B57"/>
  <text x="1526" y="85" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#2F6B57">OFFLINE · Wi-Fi off</text>
  <rect x="1668" y="66" width="164" height="30" rx="15" fill="none" stroke="#E1DED3"/>
  <text x="1684" y="85" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="12" fill="#5B655F">Bonsai 2 · 4B</text>
</g>
<line x1="88" y1="204" x2="1832" y2="204" stroke="#E1DED3"/>
<g>
<rect x="88" y="236" width="296" height="156" rx="14" fill="#FFFFFF" stroke="#E1DED3"/>
