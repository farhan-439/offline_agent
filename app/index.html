<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' http://127.0.0.1:*; media-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Pebble</title>
  <link rel="stylesheet" href="mark.css">
  <link rel="stylesheet" href="renderer.css">
</head>
<body>
<div id="app" class="app" data-view="capture" data-phase="idle" data-mode="record">

  <header class="bar drag">
    <span class="mark" id="brand-mark"></span>
    <span class="wordmark">Pebble</span>
    <span class="grow"></span>
    <button id="status" class="status" type="button" title="This Mac only">
      <i aria-hidden="true"></i><span id="status-text">Local</span>
    </button>
  </header>

  <div class="shell">
    <nav class="rail" aria-label="Pebble">
      <button class="nav" type="button" data-view="capture" aria-label="Capture" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
        <span class="nav-label">Capture</span>
      </button>
      <button class="nav" type="button" data-view="chat" aria-label="Chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-4 3V5Z"/></svg>
        <span class="nav-label">Chat</span>
      </button>
      <button class="nav" type="button" data-view="memory" aria-label="Memory">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/><path d="M3 12.5 12 17l9-4.5M3 17.5 12 22l9-4.5"/></svg>
        <span class="nav-label">Memory</span>
      </button>
    </nav>

    <main class="main">
      <!-- ===== Capture: the main page. The stone, and what it will do. ===== -->
      <section id="view-capture" class="view capture" aria-label="Capture">
        <button id="record-btn" class="stone" type="button" aria-pressed="false" aria-label="Start recording">
          <span id="stone-mark"></span>
        </button>

        <p id="mode-line" class="mode-line">Tap to record</p>

        <div class="modes" role="tablist" aria-label="What should the stone do?">
          <button class="mode" type="button" data-mode="record" role="tab" aria-selected="true">Record</button>
          <button class="mode" type="button" data-mode="ask" role="tab" aria-selected="false">Ask</button>
          <button class="mode" type="button" data-mode="translate" role="tab" aria-selected="false">Translate</button>
        </div>

        <p id="mode-busy" class="mode-busy" role="status" hidden></p>

        <div id="ask-panel" class="ask-panel" hidden>
          <form id="quick-form" class="composer" autocomplete="off">
            <button id="mic-btn" class="mic" type="button" aria-label="Ask by voice"><span id="mic-mark"></span></button>
            <label class="sr-only" for="quick-input">Your question</label>
            <input id="quick-input" maxlength="500" placeholder="Ask…" spellcheck="true">
            <button id="quick-send" type="submit" aria-label="Send">↑</button>
          </form>
        </div>

        <section id="live-panel" class="live-panel" aria-label="Live transcript" hidden>
          <header class="live-head">
            <span id="live-state" class="live-state">Listening</span>
            <span id="live-meta" class="fine"></span>
          </header>
          <ul id="live-list" class="live-list" aria-live="polite"></ul>
        </section>

        <p id="whisper" class="whisper" aria-live="assertive" hidden></p>
        <p id="record-result" class="fine" role="status" hidden></p>
      </section>

      <!-- ===== Chat ===== -->
      <section id="view-chat" class="view" aria-label="Chat" hidden>
        <div id="thread" class="thread">
          <div id="empty" class="empty">
            <p>Ask about anything you've talked about.</p>
            <div class="suggests">
              <button class="suggest" type="button">What did Maya ask me to do?</button>
              <button class="suggest" type="button">Who did I meet this week?</button>
            </div>
          </div>
        </div>
        <form id="ask-form" class="composer" autocomplete="off">
          <label class="sr-only" for="ask-input">Your question</label>
          <input id="ask-input" maxlength="500" placeholder="Ask…" spellcheck="true">
          <button id="ask-send" type="submit" aria-label="Send">↑</button>
        </form>
      </section>

      <!-- ===== Memory: four areas, each reading a real endpoint ===== -->
      <section id="view-memory" class="view page memory" aria-label="Memory" hidden>
        <div class="mem-head">
          <div>
            <h1>Memory</h1>
            <p id="mem-summary" class="fine">Reading what Pebble keeps…</p>
          </div>
          <div class="row">
            <button id="dock-btn" type="button" class="quiet">Dock today</button>
            <button id="enroll-btn" type="button" class="quiet">My voice</button>
          </div>
        </div>
        <p id="dock-status" class="fine" hidden></p>

        <div class="mem-grid">
          <section class="panel people-panel" aria-labelledby="p-people">
            <header class="panel-head">
              <h2 id="p-people"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><path d="M16.5 6.2a3 3 0 0 1 0 5.6M17.5 14.4c2 .5 3.2 2.1 3.6 4.6"/></svg>People</h2>
              <span id="people-count" class="count"></span>
            </header>
            <div class="thead cols-people" aria-hidden="true"><span>Name</span><span>Relation</span><span>Facts</span><span></span></div>
            <ul id="people-list" class="people-list"></ul>
          </section>

          <section class="panel layers-panel" aria-labelledby="p-layers">
            <header class="panel-head">
              <h2 id="p-layers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/><path d="M3 12.5 12 17l9-4.5M3 17.5 12 22l9-4.5"/></svg>Memory layers</h2>
              <span id="layer-count" class="count"></span>
            </header>
            <div class="layer-tabs" role="tablist" aria-label="Layer">
              <button class="ltab" type="button" data-layer="inputs" role="tab" aria-selected="false">Inputs</button>
              <button class="ltab" type="button" data-layer="evidence" role="tab" aria-selected="false">Evidence</button>
              <button class="ltab" type="button" data-layer="facts" role="tab" aria-selected="true">Facts</button>
              <button class="ltab" type="button" data-layer="core" role="tab" aria-selected="false">Core</button>
            </div>
            <div class="layer-filters">
              <input id="layer-search" type="search" placeholder="Search this layer…" aria-label="Search memory">
              <select id="layer-person" aria-label="Filter by person"></select>
              <select id="layer-kind" aria-label="Filter by type"></select>
            </div>
            <div class="thead cols-layers" aria-hidden="true"><span>Ref</span><span>Content</span><span>Person</span></div>
            <ul id="layer-list" class="layer-list"></ul>
          </section>

          <section class="panel record-panel" aria-labelledby="p-detail">
            <header class="panel-head">
              <h2 id="p-detail"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h7l4 4v12H7V4Z"/><path d="M14 4v4h4M9.5 12h5M9.5 15.5h5"/></svg>Selected memory</h2>
              <span id="detail-ref" class="count"></span>
            </header>
            <div id="memory-detail" class="mem-detail"></div>

            <div class="record-split">
              <h3 class="sub-head">Recent recalls <span id="recall-count" class="count"></span></h3>
              <ul id="recall-list" class="recall-list"></ul>
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <audio id="player" preload="none"></audio>
</div>
<script type="module" src="renderer.js"></script>
</body>
</html>
