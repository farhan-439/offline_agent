<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Pebble</title>
  <link rel="stylesheet" href="mark.css">
  <link rel="stylesheet" href="orb.css">
</head>
<body>
  <!-- ===== The pebble (floating window). Only the mark, until you touch it. ===== -->
  <div id="stage" class="stage" data-island="idle" data-listening="false" data-active="" data-phase="idle">
    <button id="pebble" class="pebble" type="button" aria-label="Pebble. Tap to talk." title="Pebble">
      <span id="pebble-mark" class="pebble-mark"></span>
      <span id="badge" class="badge" hidden aria-hidden="true"></span>
    </button>

    <section id="island" class="island" aria-live="polite">
      <p id="island-line" class="island-line">Listening…</p>
      <ul id="island-lines" class="island-lines" hidden></ul>
      <div id="subs" class="subs" role="group" aria-label="What should Pebble do?">
        <button type="button" class="sub" data-kind="record"><span class="glyph" aria-hidden="true">●</span>Record</button>
        <button type="button" class="sub" data-kind="translate"><span class="glyph" aria-hidden="true">文A</span>Translate</button>
        <button type="button" class="sub" data-kind="ask"><span class="glyph" aria-hidden="true">?</span>Ask</button>
      </div>
      <div id="live-actions" class="live-actions" hidden>
        <button id="reply-btn" class="sub reply" type="button" hidden>Reply</button>
        <button id="island-stop" class="sub stop" type="button" hidden>Stop</button>
      </div>
    </section>
  </div>

  <!-- ===== The conversation (separate window, ?chat=1) ===== -->
  <section id="card" class="card" hidden>
    <header class="card-head">
      <span class="card-title">Pebble</span>
      <button id="card-close" class="ghost" type="button" aria-label="Close">✕</button>
    </header>
    <div id="thread" class="thread"></div>
    <p id="notice" class="notice" hidden aria-live="assertive"></p>
    <form id="ask-form" class="composer" autocomplete="off">
      <label class="sr-only" for="ask-input">Ask Pebble</label>
      <input id="ask-input" type="text" maxlength="500" placeholder="Ask…" spellcheck="true">
      <button id="ask-send" type="submit" aria-label="Send">↑</button>
    </form>
  </section>

  <script type="module" src="orb.js"></script>
</body>
</html>
