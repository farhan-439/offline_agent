<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Kindred Orb</title>
  <link rel="stylesheet" href="orb.css">
</head>
<body>
  <div id="stage" class="stage" data-phase="idle">
    <section id="card" class="card" hidden aria-live="assertive">
      <header class="card-head">
        <span id="card-label" class="card-label">Kindred</span>
        <button id="card-close" type="button" class="close" aria-label="Dismiss">✕</button>
      </header>
      <p id="card-text" class="card-text"></p>
      <p id="ask-status" class="ask-status" aria-live="polite"></p>
      <form id="orb-ask-form" class="orb-ask-form" autocomplete="off">
        <label class="sr-only" for="orb-question">Ask Kindred</label>
        <input id="orb-question" type="text" maxlength="500" placeholder="Ask about a memory…" spellcheck="true">
        <button id="orb-send" type="submit">Send</button>
      </form>
      <button id="orb-mic" type="button" class="mic">🎙 Talk to Kindred</button>
    </section>
    <button id="orb" type="button" class="orb" aria-label="Open Kindred conversation. Right-click for menu" title="Talk to Kindred">
      <span class="orb-core" aria-hidden="true"></span><span class="orb-glow" aria-hidden="true"></span>
      <span id="orb-rec" class="orb-rec" hidden>REC</span>
    </button>
  </div>
  <script type="module" src="orb.js"></script>
</body>
</html>
